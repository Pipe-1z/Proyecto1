<main role="main">

    <section class="jumbotron text-center">
        <div class="container pt-5">
            <h1 class="jumbotron-heading">Agregar tarea</h1>
            <p class="lead text-muted pb-3">Añade una nueva tarea a tu lista. Completa los campos y presiona "agregar"
                para guardarla.</p>
            <form class="px-5 mx-5 mb-5">
                <div class="form-group">
                    <input id="title" type="text" class="form-control" placeholder="Título">
                </div>
                <br>
                <div class="form-group">
                    <select id="category" class="form-control custom-select" id="inputGroupSelect01">
                        <option value="" disabled selected>Elige categoría</option>
                        <option value="trabajo">Trabajo</option>
                        <option value="personal">Personal</option>
                        <option value="estudio">Estudio</option>
                        <option value="salud">Salud</option>
                        <option value="finanzas">Finanzas</option>
                        <option value="compras">Compras</option>
                        <option value="ocio">Ocio</option>
                        <option value="viajes">Viajes</option>
                        <option value="urgente">Urgente</option>
                        <option value="tarea-en-casa">Tarea en casa</option>
                    </select>
                </div>
                <br>
                <div class="form-group">
                    <textarea id="description" class="form-control mb-5" aria-label="With textarea"
                        placeholder="Descripción"></textarea>
                </div>
                <div class="form-group">
                    <button type="button" class="btn btn-dark btn-lg"><strong>Agregar</strong></button>
                </div>
            </form>
        </div>
    </section>

    <section class="container px-5">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">Categoría</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Estado</th>
                    <th scope="col"> </th>
                </tr>
            </thead>
            <tbody id="task-table">
                
            </tbody>
        </table>

    </section>
    

</main>
